<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Your week</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #1d1f23; --muted: #6b7280; --water: #2f80ed; --stretch: #f2994a; --grid: #e5e7eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #18191c; --card: #232428; --text: #f1f2f4; --muted: #9ca3af; --water: #5aa2ff; --stretch: #f6ad6b; --grid: #34363c; }
    }
    body { margin: 0; padding: 20px; background: var(--bg); color: var(--text);
      font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif; }
    h1 { font-size: 20px; margin: 0 0 14px; }
    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .tile { background: var(--card); border-radius: 12px; padding: 12px; }
    .tile b { display: block; font-size: 24px; }
    .tile span { color: var(--muted); font-size: 12px; }
    .card { background: var(--card); border-radius: 12px; padding: 14px; }
    .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    svg text { fill: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <h1>Your week, <span id="name"></span></h1>
  <div class="tiles">
    <div class="tile"><b id="water"></b><span>glasses today</span></div>
    <div class="tile"><b id="stretch"></b><span>stretches today</span></div>
    <div class="tile"><b id="streak"></b><span>day streak 🔥</span></div>
  </div>
  <div class="card">
    <div class="legend"><span><i style="background:var(--water)"></i>Water (glasses)</span><span><i style="background:var(--stretch)"></i>Stretches</span><span>- - daily water goal</span></div>
    <svg id="chart" viewBox="0 0 380 170" width="100%"></svg>
  </div>
  <script src="stats.js"></script>
</body>
</html>
