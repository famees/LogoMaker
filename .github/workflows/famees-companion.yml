name: Famees Companion

on:
  workflow_dispatch:
  push:
    paths:
      - 'FameesCompanion/**'
      - '.github/workflows/famees-companion.yml'

defaults:
  run:
    working-directory: FameesCompanion

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FameesCompanion/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: FameesCompanion/dist/*.dmg
            name: Famees-Companion-Mac
          - os: windows-latest
            script: dist:win
            files: FameesCompanion/dist/*.exe
            name: Famees-Companion-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FameesCompanion/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
